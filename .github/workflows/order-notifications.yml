name: Order Notifications

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This runs approximately every 5 minutes.
    - cron: "*/5 * * * *"

# Prevent overlapping runs from sending the same order twice.
concurrency:
  group: order-notifications
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-orders:
    name: Check orders and send Telegram notifications
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests
          fi

      - name: Validate required secrets
        env:
          GOOGLE_SHEET_API_URL: ${{ secrets.GOOGLE_SHEET_API_URL }}
          GOOGLE_SHEET_API_KEY: ${{ secrets.GOOGLE_SHEET_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          [ -n "$GOOGLE_SHEET_API_URL" ] || { echo "ERROR: GOOGLE_SHEET_API_URL is missing"; exit 1; }
          [ -n "$GOOGLE_SHEET_API_KEY" ] || { echo "ERROR: GOOGLE_SHEET_API_KEY is missing"; exit 1; }
          [ -n "$TELEGRAM_TOKEN" ] || { echo "ERROR: TELEGRAM_TOKEN is missing"; exit 1; }
          [ -n "$TELEGRAM_CHAT_ID" ] || { echo "ERROR: TELEGRAM_CHAT_ID is missing"; exit 1; }
          case "$GOOGLE_SHEET_API_URL" in
            */exec|*/exec/) echo "Google Apps Script endpoint format OK" ;;
            *) echo "ERROR: GOOGLE_SHEET_API_URL must be the deployed Apps Script /exec URL"; exit 1 ;;
          esac

      - name: Check Google Sheet and notify Telegram
        env:
          GOOGLE_SHEET_API_URL: ${{ secrets.GOOGLE_SHEET_API_URL }}
          GOOGLE_SHEET_API_KEY: ${{ secrets.GOOGLE_SHEET_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u order_checker.py
